[package]
name = "api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"
test = false

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
test = false

[lib]
name = "api"
path = "src/lib.rs"
test = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4"
hmac = "0.12"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
