# ==============================================================================
# Docker Compose untuk Lingkungan Produksi PMB UPITRA
# Dilengkapi Reverse Proxy SSL, Postgres Backup Cron, Logging Terstruktur, & Jaringan Terisolasi
# ==============================================================================

version: "3.8"

networks:
  pmb-internal:
    driver: bridge
    internal: true
  pmb-public:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backup-data:
  nginx-logs:

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy (Nginx SSL/TLS & Load Balancer)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: pmb-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - pmb-public
      - pmb-internal
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Database PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pmb-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmb_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-pmb_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Wajib diisi di .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pmb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmb_prod_user} -d ${POSTGRES_DB:-pmb_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Cache & In-Memory Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pmb-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Wajib diisi di .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    networks:
      - pmb-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Object Storage MinIO S3
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pmb-prod-minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Wajib diisi di .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Wajib diisi di .env}
    volumes:
      - minio-data:/data
    networks:
      - pmb-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Backend Rust Axum API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pmb-prod-api
    restart: always
    environment:
      APP_ENV: production
      PORT: 8080
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-pmb_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pmb_prod_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-pmb-berkas-prod}
      SESSION_SECRET: ${SESSION_SECRET:?Wajib diisi minimal 32 karakter di .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://pmb.upitra.ac.id}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-true}
      SQLX_OFFLINE: "true"
      RUST_LOG: "info,api=debug,tower_http=info"
    networks:
      - pmb-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 6. Frontend Web SPA React
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pmb-prod-web
    restart: always
    networks:
      - pmb-internal
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 7. Scheduled Postgres Backup (Daily Cron 02:00 WIB, 14-Day Retention)
  # ----------------------------------------------------------------------------
  db-backup:
    image: postgres:16-alpine
    container_name: pmb-prod-db-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pmb_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-pmb_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
    volumes:
      - backup-data:/backups
      - ./scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    networks:
      - pmb-internal
    entrypoint: |
      /bin/sh -c '
        chmod +x /usr/local/bin/backup_postgres.sh
        echo "0 2 * * * /usr/local/bin/backup_postgres.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[INFO] Daemon cron backup database aktif (02:00 WIB setiap hari)..."
        crond -f -l 2
      '
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

