name: CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (Rust / Axum)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/api/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check (cargo fmt)
        run: cargo fmt --check

      - name: Lint & Static Analysis (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests (cargo test)
        run: cargo test

  frontend:
    name: Frontend (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check (npm run lint)
        run: npm run lint

      - name: Type Check (npm run typecheck)
        run: npm run typecheck

      - name: Unit Tests (npm run test)
        run: npm run test

      - name: Production Build (npm run build)
        run: npm run build

